name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_SITE_URL: ${{ vars.VITE_SITE_URL || 'https://barriuso.cc' }}
      BASE_PATH: ${{ vars.BASE_PATH || '/' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      - name: Configure public address
        shell: bash
        run: |
          repo="${GITHUB_REPOSITORY#*/}"
          if [ -n "$VITE_SITE_URL" ]; then
            base="${BASE_PATH:-/}"
            site="$VITE_SITE_URL"
          else
            if [ "${repo,,}" = "${GITHUB_REPOSITORY_OWNER,,}.github.io" ]; then
              base="/"
            else
              base="/$repo/"
            fi
            base="${BASE_PATH:-$base}"
            site="https://${GITHUB_REPOSITORY_OWNER}.github.io${base%/}"
          fi
          echo "BASE_PATH=$base" >> "$GITHUB_ENV"
          echo "VITE_SITE_URL=$site" >> "$GITHUB_ENV"
      - name: Build
        run: npm run build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
